name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-edition:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: "migrate-studio-python"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_env.py
      - run: python -m pytest -q tests/python python/test_mig_apply.py
      - run: |
          for test in tests/js/*.js; do
            node "$test"
          done

  shiny-edition:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: "migrate-studio-r-shiny"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.2.3"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: Rscript tools/install_dependencies.R --dev
      - run: python -m pip install -r requirements-dev.txt
      - run: Rscript tools/check_env.R
        env:
          MIGRATE_STUDIO_ENGINE: r
      - run: Rscript tools/run_r_tests.R
      - run: Rscript tools/run_js_tests.R
      - run: python -m pytest -q python

  release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_release.py
